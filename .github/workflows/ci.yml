name: CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "backend/**"
      - "docs/**"
      - "tools/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
      - develop
      - "feature/**"
    paths:
      - "backend/**"
      - "docs/**"
      - "tools/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run backend tests
        run: mvn -B test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  quality-gate:
    name: Static quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run static quality gate
        run: python3 tools/quality_gate.py

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-report
          path: build/reports/
          if-no-files-found: error

      - name: Send warning email
        if: always()
        env:
          QUALITY_GATE_JSON: build/reports/quality-gate.json
          QUALITY_GATE_REPORT: build/reports/quality-gate.md
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          QUALITY_ALERT_FROM: ${{ secrets.QUALITY_ALERT_FROM }}
          QUALITY_ALERT_TO: ${{ secrets.QUALITY_ALERT_TO }}
        run: python3 tools/send_quality_warning_email.py
